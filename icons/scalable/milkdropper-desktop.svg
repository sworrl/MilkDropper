<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bgDt" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4a1d6e"/>
      <stop offset="100%" stop-color="#1a0833"/>
    </radialGradient>
    <linearGradient id="barsDt" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff2d95"/>
      <stop offset="50%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#ffd60a"/>
    </linearGradient>
    <filter id="glowDt">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#bgDt)"/>
  <!-- Monitor/desktop frame -->
  <rect x="22" y="28" width="84" height="56" rx="4" fill="none" stroke="#c77dff" stroke-width="2.5"/>
  <rect x="48" y="86" width="32" height="4" fill="#c77dff"/>
  <rect x="38" y="92" width="52" height="4" rx="1" fill="#c77dff"/>
  <!-- Visualizer bars inside -->
  <g filter="url(#glowDt)">
    <rect x="30" y="58" width="6" height="20" rx="2" fill="url(#barsDt)"/>
    <rect x="40" y="48" width="6" height="30" rx="2" fill="url(#barsDt)"/>
    <rect x="50" y="38" width="6" height="40" rx="2" fill="url(#barsDt)"/>
    <rect x="60" y="46" width="6" height="32" rx="2" fill="url(#barsDt)"/>
    <rect x="70" y="34" width="6" height="44" rx="2" fill="url(#barsDt)"/>
    <rect x="80" y="44" width="6" height="34" rx="2" fill="url(#barsDt)"/>
    <rect x="90" y="54" width="6" height="24" rx="2" fill="url(#barsDt)"/>
  </g>
  <circle cx="32" cy="36" r="2.5" fill="#ffd60a" opacity="0.8"/>
  <circle cx="32" cy="44" r="2.5" fill="#ffd60a" opacity="0.8"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#c77dff" stroke-width="2" opacity="0.6"/>
</svg>
