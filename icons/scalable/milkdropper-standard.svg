<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bgSt" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1d4a3a"/>
      <stop offset="100%" stop-color="#081a14"/>
    </radialGradient>
    <linearGradient id="barsSt" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#06ffa5"/>
      <stop offset="50%" stop-color="#0aefff"/>
      <stop offset="100%" stop-color="#ffd60a"/>
    </linearGradient>
    <filter id="glowSt">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#bgSt)"/>
  <!-- Window frame with title bar -->
  <rect x="20" y="30" width="88" height="68" rx="4" fill="none" stroke="#06ffa5" stroke-width="2.5"/>
  <rect x="20" y="30" width="88" height="10" rx="4" fill="#06ffa5" opacity="0.6"/>
  <circle cx="28" cy="35" r="2" fill="#ff5e5b"/>
  <circle cx="36" cy="35" r="2" fill="#ffd60a"/>
  <circle cx="44" cy="35" r="2" fill="#06ffa5"/>
  <!-- Visualizer bars inside window -->
  <g filter="url(#glowSt)">
    <rect x="28" y="68" width="6" height="22" rx="2" fill="url(#barsSt)"/>
    <rect x="38" y="58" width="6" height="32" rx="2" fill="url(#barsSt)"/>
    <rect x="48" y="48" width="6" height="42" rx="2" fill="url(#barsSt)"/>
    <rect x="58" y="56" width="6" height="34" rx="2" fill="url(#barsSt)"/>
    <rect x="68" y="46" width="6" height="44" rx="2" fill="url(#barsSt)"/>
    <rect x="78" y="54" width="6" height="36" rx="2" fill="url(#barsSt)"/>
    <rect x="88" y="62" width="6" height="28" rx="2" fill="url(#barsSt)"/>
  </g>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#06ffa5" stroke-width="2" opacity="0.6"/>
</svg>
